<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ショップ予約 練習モード</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Noto Sans JP", sans-serif;
  background: #f5f5f5;
  color: #222;
}
button, input { font: inherit; }
.app {
  width: min(100%, 480px);
  min-height: 100vh;
  margin: 0 auto;
  background: #fff;
}
.header {
  padding: 18px 18px 14px;
  border-bottom: 1px solid #e5e5e5;
  position: sticky;
  top: 0;
  background: rgba(255,255,255,.96);
  z-index: 5;
}
.header-title { font-size: 19px; font-weight: 700; }
.header-sub { margin-top: 4px; font-size: 12px; color: #777; }

.progress {
  display: flex;
  gap: 6px;
  padding: 12px 16px;
  border-bottom: 1px solid #eee;
}
.progress span {
  flex: 1;
  height: 4px;
  border-radius: 99px;
  background: #ddd;
}
.progress span.active { background: #222; }

main { padding: 20px 16px 40px; }
.screen { display: none; }
.screen.active { display: block; }
h1 { font-size: 23px; margin: 4px 0 8px; }
.lead { color: #777; font-size: 14px; line-height: 1.6; margin: 0 0 20px; }

.shop-list { display: grid; gap: 10px; }
.shop {
  width: 100%;
  padding: 16px;
  text-align: left;
  background: #fff;
  border: 1px solid #ddd;
  border-radius: 12px;
  cursor: pointer;
}
.shop:active { transform: scale(.99); }
.shop.selected { border: 2px solid #222; padding: 15px; }
.shop-name { font-weight: 700; }
.shop-place { margin-top: 5px; font-size: 12px; color: #777; }

.section {
  background: #fafafa;
  border-radius: 12px;
  padding: 15px;
  margin-bottom: 16px;
}
label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 8px; }
input[type="date"] {
  width: 100%;
  padding: 13px;
  border: 1px solid #ccc;
  border-radius: 9px;
  background: #fff;
}

.times {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}
.time {
  min-height: 48px;
  border: 1px solid #ddd;
  background: #fff;
  border-radius: 9px;
  cursor: pointer;
}
.time.selected {
  background: #222;
  color: #fff;
  border-color: #222;
}

.actions {
  display: flex;
  gap: 9px;
  margin-top: 20px;
}
.btn {
  flex: 1;
  min-height: 48px;
  border-radius: 10px;
  border: 1px solid #ccc;
  background: #fff;
  cursor: pointer;
  font-weight: 600;
}
.btn.primary {
  background: #222;
  color: #fff;
  border-color: #222;
}
.btn:disabled {
  background: #ddd;
  color: #999;
  border-color: #ddd;
  cursor: not-allowed;
}

.confirm {
  border: 1px solid #e0e0e0;
  border-radius: 12px;
  overflow: hidden;
}
.confirm-row {
  padding: 15px;
  border-bottom: 1px solid #eee;
}
.confirm-row:last-child { border-bottom: 0; }
.confirm-label { font-size: 12px; color: #888; }
.confirm-value { margin-top: 4px; font-weight: 600; }

.notice {
  padding: 13px;
  border-radius: 9px;
  background: #f1f1f1;
  color: #666;
  font-size: 12px;
  line-height: 1.6;
  margin-top: 16px;
}

.complete {
  text-align: center;
  padding: 35px 10px 20px;
}
.complete-icon {
  width: 66px;
  height: 66px;
  margin: 0 auto 18px;
  border-radius: 50%;
  background: #222;
  color: #fff;
  display: grid;
  place-items: center;
  font-size: 30px;
}
.complete h1 { font-size: 24px; }
.reservation-number {
  display: inline-block;
  margin-top: 10px;
  padding: 9px 14px;
  border-radius: 8px;
  background: #f1f1f1;
  font-size: 13px;
  font-weight: 700;
}
.timer {
  margin-top: 22px;
  font-size: 13px;
  color: #777;
}

@media (max-width: 380px) {
  .times { grid-template-columns: repeat(2, 1fr); }
}
</style>
</head>

<body>
<div class="app">
  <header class="header">
    <div class="header-title">ショップ入店予約</div>
    <div class="header-sub">練習モード（実際の予約は行われません）</div>
  </header>

  <div class="progress" aria-label="予約ステップ">
    <span id="p1" class="active"></span>
    <span id="p2"></span>
    <span id="p3"></span>
    <span id="p4"></span>
  </div>

  <main>
    <!-- STEP 1 -->
    <section id="screen1" class="screen active">
      <h1>ショップを選択</h1>
      <p class="lead">入店したいショップを選択してください。</p>

      <div class="shop-list">
        <button class="shop" data-shop="グランドエンポーリアム">
          <div class="shop-name">グランドエンポーリアム</div>
          <div class="shop-place">東京ディズニーランド</div>
        </button>

        <button class="shop" data-shop="ボン・ヴォヤージュ">
          <div class="shop-name">ボン・ヴォヤージュ</div>
          <div class="shop-place">舞浜駅前</div>
        </button>

        <button class="shop" data-shop="エンポーリオ">
          <div class="shop-name">エンポーリオ</div>
          <div class="shop-place">東京ディズニーシー</div>
        </button>
      </div>

      <div class="actions">
        <button type="button" id="next1" class="btn primary" disabled>次へ</button>
      </div>
    </section>

    <!-- STEP 2 -->
    <section id="screen2" class="screen">
      <h1>来店日を選択</h1>
      <p class="lead">ショップへ行く日を選択してください。</p>

      <div class="section">
        <label for="date">来店希望日</label>
        <input id="date" type="date">
      </div>

      <div class="actions">
        <button class="btn" id="back2">戻る</button>
        <button class="btn primary" id="next2">次へ</button>
      </div>
    </section>

    <!-- STEP 3 -->
    <section id="screen3" class="screen">
      <h1>入店時間を選択</h1>
      <p class="lead">希望する時間帯を選択してください。</p>

      <div class="section">
        <div class="times" id="times"></div>
      </div>

      <div class="actions">
        <button class="btn" id="back3">戻る</button>
        <button class="btn primary" id="next3" disabled>次へ</button>
      </div>
    </section>

    <!-- STEP 4 -->
    <section id="screen4" class="screen">
      <h1>予約内容を確認</h1>
      <p class="lead">内容を確認して「予約する」を押してください。</p>

      <div class="confirm">
        <div class="confirm-row">
          <div class="confirm-label">ショップ</div>
          <div class="confirm-value" id="confirmShop"></div>
        </div>
        <div class="confirm-row">
          <div class="confirm-label">来店日</div>
          <div class="confirm-value" id="confirmDate"></div>
        </div>
        <div class="confirm-row">
          <div class="confirm-label">入店時間</div>
          <div class="confirm-value" id="confirmTime"></div>
        </div>
      </div>

      <div class="notice">
        ※このページは練習用です。「予約する」を押しても実際の予約・購入・決済は発生しません。
      </div>

      <div class="actions">
        <button class="btn" id="back4">戻る</button>
        <button class="btn primary" id="reserve">予約する</button>
      </div>
    </section>

    <!-- COMPLETE -->
    <section id="screen5" class="screen">
      <div class="complete">
        <div class="complete-icon">✓</div>
        <h1>予約完了</h1>
        <p class="lead">練習用の予約が完了しました。</p>
        <div class="reservation-number" id="reservationNumber"></div>
        <div class="timer" id="completeInfo"></div>

        <div class="actions">
          <button class="btn primary" id="restart">もう一度練習する</button>
        </div>
      </div>
    </section>
  </main>
</div>

<script>
(() => {
  const screens = [1,2,3,4,5];
  let selectedShop = "";
  let selectedTime = "";

  const $ = (id) => document.getElementById(id);

  function showScreen(n) {
    screens.forEach(i => {
      $("screen" + i).classList.toggle("active", i === n);
    });

    for (let i = 1; i <= 4; i++) {
      $("p" + i).classList.toggle("active", i === n);
    }
  }

  // 今日以降の日付だけ選べるようにする
  const dateInput = $("date");
  const today = new Date();
  const yyyy = today.getFullYear();
  const mm = String(today.getMonth() + 1).padStart(2, "0");
  const dd = String(today.getDate()).padStart(2, "0");
  const todayString = `${yyyy}-${mm}-${dd}`;
  dateInput.min = todayString;
  dateInput.value = todayString;

  // ショップ選択
  document.querySelector(".shop-list").addEventListener("click", (event) => {
    const button = event.target.closest(".shop");
    if (!button) return;

    document.querySelectorAll(".shop").forEach(b => b.classList.remove("selected"));
    button.classList.add("selected");
    selectedShop = button.dataset.shop || "";
    $("next1").disabled = !selectedShop;
  });

  $("next1").addEventListener("click", () => {
    showScreen(2);
  });

  $("back2").addEventListener("click", () => {
    showScreen(1);
  });

  $("next2").addEventListener("click", () => {
    if (!dateInput.value) {
      alert("来店日を選択してください。");
      return;
    }
    createTimeButtons();
    showScreen(3);
  });

  $("back3").addEventListener("click", () => {
    showScreen(2);
  });

  function createTimeButtons() {
    const times = [
      "09:00", "09:30", "10:00",
      "10:30", "11:00", "11:30",
      "12:00", "12:30", "13:00",
      "13:30", "14:00", "14:30",
      "15:00", "15:30", "16:00",
      "16:30", "17:00", "17:30"
    ];

    const container = $("times");
    container.innerHTML = "";
    selectedTime = "";
    $("next3").disabled = true;

    times.forEach(time => {
      const button = document.createElement("button");
      button.className = "time";
      button.type = "button";
      button.textContent = time;

      button.addEventListener("click", () => {
        container.querySelectorAll(".time")
          .forEach(b => b.classList.remove("selected"));

        button.classList.add("selected");
        selectedTime = time;
        $("next3").disabled = false;
      });

      container.appendChild(button);
    });
  }

  $("next3").addEventListener("click", () => {
    if (!selectedTime) return;

    $("confirmShop").textContent = selectedShop;
    $("confirmDate").textContent = formatDate(dateInput.value);
    $("confirmTime").textContent = selectedTime;

    showScreen(4);
  });

  $("back4").addEventListener("click", () => {
    showScreen(3);
  });

  $("reserve").addEventListener("click", () => {
    const random = Math.floor(100000 + Math.random() * 900000);
    $("reservationNumber").textContent = "受付番号：" + random;
    $("completeInfo").textContent =
      `${formatDate(dateInput.value)} ${selectedTime} / ${selectedShop}`;

    showScreen(5);
  });

  $("restart").addEventListener("click", () => {
    selectedShop = "";
    selectedTime = "";

    document.querySelectorAll(".shop")
      .forEach(b => b.classList.remove("selected"));

    $("next1").disabled = true;
    $("next3").disabled = true;

    showScreen(1);
  });

  function formatDate(value) {
    const parts = value.split("-");
    if (parts.length !== 3) return value;
    return `${parts[0]}年${Number(parts[1])}月${Number(parts[2])}日`;
  }
})();
</script>
</body>
</html>
