<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>スタンバイパス取得 練習</title>
<style>
:root{--blue:#42add8;--navy:#092c55;--muted:#a8bdce;--line:#e7ebef;--green:#20b52b}*{box-sizing:border-box}body{margin:0;background:#f2f4f6;color:var(--navy);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}.phone{max-width:430px;min-height:100vh;margin:auto;background:#fff;position:relative;padding-bottom:94px}.top{height:62px;display:grid;grid-template-columns:48px 1fr 48px;align-items:center;text-align:center;border-bottom:1px solid var(--line);font-size:19px;font-weight:700}.nav{font-size:30px;color:var(--blue);font-weight:300;cursor:pointer;border:0;background:none}.stepbar{padding:9px 16px 10px;color:#7c8b98;font-size:12px;border-bottom:1px solid #f1f2f3}.track{height:4px;background:#e7e9eb;border-radius:4px;margin-top:7px;overflow:hidden}.fill{height:100%;width:16.66%;background:var(--blue);transition:width .2s}main{padding:18px 28px 22px}.heading{font-size:22px;font-weight:700;margin:4px 0 10px}.desc{font-size:14px;color:#8795a2;line-height:1.55;margin-bottom:18px}.panel{border-bottom:1px solid var(--line);padding:16px 0}.choice{display:flex;gap:12px;align-items:center;width:100%;padding:17px 14px;margin:10px 0;border:1px solid #dce3e8;border-radius:7px;background:#fff;color:var(--navy);font-size:16px;text-align:left;cursor:pointer}.choice.sel{border:2px solid var(--blue);padding:16px 13px}.radio{width:23px;height:23px;border:2px solid #aab9c5;border-radius:50%;flex:none}.choice.sel .radio{border:7px solid var(--green)}.btn{position:absolute;bottom:0;left:0;width:100%;padding:20px 18px calc(20px + env(safe-area-inset-bottom));border:0;background:var(--blue);color:#fff;font-size:20px;font-weight:700;cursor:pointer}.btn:disabled{background:#b9cbd5;cursor:default}.bagicon{font-size:48px;text-align:center;margin:28px 0 12px}.tip{background:#f5f8fa;color:#718493;padding:12px;border-radius:5px;font-size:12px;line-height:1.6;margin-top:16px}.shophead{display:flex;gap:15px;align-items:center;padding:22px 0 35px;border-bottom:1px solid var(--line)}.shopthumb{width:76px;height:76px;border-radius:50%;border:4px solid #ed9692;display:flex;align-items:center;justify-content:center;background:#f4f5f6;color:#718493;text-align:center;font-size:12px;flex:none}.shopname{font-size:18px;font-weight:700}.shopdesc{font-size:14px;color:#8795a2;margin-top:6px}.hour{border-bottom:1px solid var(--line);padding:22px 0}.hourtitle{font-size:18px;font-weight:700;margin-bottom:20px}.hourtitle.none{color:var(--muted);margin:0}.none-label{float:right;font-size:14px}.slot{display:flex;align-items:center;gap:15px;min-height:60px;color:var(--muted);font-size:16px;font-weight:600;cursor:pointer}.slot .dot{width:28px;height:28px;border-radius:50%;background:var(--muted);flex:none}.slot .status{margin-left:auto;font-size:13px;white-space:nowrap}.slot.available{color:var(--navy)}.slot.available .dot{background:#fff;border:7px solid var(--green)}.slot.disabled{cursor:default}.review{padding:0}.reviewrow{display:flex;justify-content:space-between;gap:16px;padding:17px 0;border-bottom:1px solid var(--line);font-size:15px}.reviewrow span{color:#8493a0}.success{text-align:center;padding:45px 8px}.success .tick{font-size:58px;color:var(--green)}.small{font-size:12px;color:#81909b;line-height:1.6}
</style></head><body><div class="phone"><div class="top"><button class="nav" id="back" aria-label="戻る" onclick="goBack()">‹</button><div id="topTitle">スタンバイパス</div><button class="nav" aria-label="閉じる" onclick="restart()">×</button></div><div class="stepbar">練習ステップ <span id="stepNo">1</span> / 6<div class="track"><div id="fill" class="fill"></div></div></div><main id="app"></main><button id="next" class="btn" onclick="nextStep()" disabled>次へ</button></div>
<script>
let step=1,tickets=[],facility='',slot='';const app=document.getElementById('app'),next=document.getElementById('next');
const facilities=['ディズニー＆カンパニー','ギャグファクトリー／ファイブ・アンド・ダイム','マクダックス・デパートメントストア','エンポーリオ','ファンタジースプリングス・ギフト','スリーピーホエール・ショップ','グランマ・サラのキッチン（画面例）'];
function top(){document.getElementById('stepNo').textContent=step;document.getElementById('fill').style.width=(step/6*100)+'%';document.getElementById('back').style.visibility=step===1?'hidden':'visible';document.getElementById('topTitle').textContent=step===4?'来店時間選択':step===5?'スタンバイ内容確認':step===6?'取得完了':'スタンバイパス';}
function setNext(enabled,label='次へ'){next.disabled=!enabled;next.textContent=label;}
function render(){top();if(step===1){app.innerHTML=`<div class="bagicon">👜</div><div class="heading">スタンバイパス</div><div class="desc">練習用画面です。スタンバイパス取得のメニューを選んで進みます。</div><button class="choice" onclick="step=2;render()"><span class="radio"></span><span>スタンバイパス</span></button><div class="tip">実際のアプリでは「プラン」からスタンバイパスを選択します。</div>`;setNext(true,'スタンバイパスを選択');next.onclick=()=>{step=2;render()};}
else if(step===2){app.innerHTML=`<div class="heading">パークチケット選択</div><div class="desc">利用するメンバーのパークチケットを選択してください。練習用に複数選択できます。</div>${['東京ディズニーランド','東京ディズニーシー'].map((x,i)=>`<button class="choice ${tickets.includes(x)?'sel':''}" onclick="toggleTicket('${x}')"><span class="radio"></span><span>${x}<br><span class="small">練習用チケット ${i+1}</span></span></button>`).join('')}<div class="tip">実際の取得には、対象のパークチケットの認証が必要です。</div>`;setNext(tickets.length>0);next.onclick=()=>{step=3;render()};}
else if(step===3){app.innerHTML=`<div class="heading">施設選択</div><div class="desc">スタンバイパス対象施設の例から選択してください。表示は練習用で、当日の対象施設・発券状況とは連動しません。</div>${facilities.map(x=>`<button class="choice ${facility===x?'sel':''}" onclick="facility='${x}';render()"><span class="radio"></span><span>${x}</span></button>`).join('')}<div class="tip">対象施設や実施時間は日によって異なります。実際の状況は公式アプリで確認してください。</div>`;setNext(!!facility);next.onclick=()=>{step=4;render()};}
else if(step===4){const hours=[{h:'12:00',none:true},{h:'13:00',slots:[['13:00 ~ 13:15',false],['13:15 ~ 13:30',false],['13:30 ~ 13:45',false],['13:45 ~ 14:00',true]]},{h:'14:00',none:true},{h:'15:00',none:true},{h:'16:00',none:true},{h:'17:00',none:true}];app.innerHTML=`<div class="shophead"><div class="shopthumb">施設<br>イメージ</div><div><div class="shopname">${escapeHtml(facility)}</div><div class="shopdesc">来店時間を選択してください</div></div></div>${hours.map(x=>x.slots?`<section class="hour"><div class="hourtitle">${x.h} ~</div>${x.slots.map(s=>`<div class="slot ${s[1]?'available':''} ${slot===s[0]?'selected':''} ${s[1]?'':'disabled'}" ${s[1]?`onclick="slot='${s[0]}';render()"`:''}><span class="dot" style="${slot===s[0]?'background:#fff;border:7px solid var(--green)':''}"></span><span>${s[0]}</span>${s[1]?'':'<span class="status">選択不可</span>'}</div>`).join('')}</section>`:`<section class="hour"><div class="hourtitle none">${x.h} ~ <span class="none-label">在庫なし</span></div></section>`).join('')}<div class="tip">15分刻みの表示は、送ってくれたスクリーンショットを参考にした練習用サンプルです。実際の空き時間ではありません。</div>`;setNext(!!slot);next.onclick=()=>{step=5;render()};}
else if(step===5){app.innerHTML=`<div class="heading">スタンバイ内容確認</div><div class="desc">以下の内容を確認してください。</div><div class="review">${[['パークチケット',tickets.join('、')],['施設',facility],['時間帯',slot]].map(r=>`<div class="reviewrow"><span>${r[0]}</span><b>${escapeHtml(r[1])}</b></div>`).join('')}</div><div class="tip">これは操作練習用です。「取得」を押しても実際のスタンバイパスは発行されません。</div>`;setNext(true,'取得');next.onclick=()=>{step=6;render()};}
else{app.innerHTML=`<div class="success"><div class="tick">✓</div><div class="heading">取得の練習完了</div><div class="desc">画面の流れを最後まで練習できました。</div><div class="tip">練習用のため、実際のパスや予約情報は発行されていません。</div></div>`;setNext(true,'もう一度練習する');next.onclick=restart;}}
function toggleTicket(x){tickets=tickets.includes(x)?tickets.filter(t=>t!==x):[...tickets,x];render()}function nextStep(){if(step<6){step++;render()}}function goBack(){if(step>1){step--;render()}}function restart(){step=1;tickets=[];facility='';slot='';render()}function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}render();
</script></body></html>
