<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff"><title>スタンバイパス取得 練習</title>
<style>
:root{--blue:#1688d4;--navy:#172b3b;--muted:#8494a1;--line:#e2e7eb;--bg:#f4f6f8;--green:#21a83a;--red:#cf6b6b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--navy);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}.phone{max-width:460px;min-height:100dvh;margin:auto;background:#fff;position:relative;padding-bottom:102px;box-shadow:0 0 24px #00000008}.top{height:60px;display:grid;grid-template-columns:52px 1fr 52px;align-items:center;text-align:center;border-bottom:1px solid var(--line);font-size:17px;font-weight:700}.nav{font-size:28px;color:var(--blue);border:0;background:none}.stepbar{padding:10px 18px;color:#7b8b97;font-size:12px;border-bottom:1px solid #f0f2f4}.track{height:4px;background:#e8edf0;border-radius:4px;margin-top:8px;overflow:hidden}.fill{height:100%;background:var(--blue);transition:width .2s}main{padding:22px 22px 26px}.eyebrow{font-size:12px;color:var(--blue);font-weight:700;letter-spacing:.04em;margin-bottom:8px}.heading{font-size:23px;line-height:1.35;font-weight:750;margin:0 0 10px}.desc{font-size:14px;color:#7b8994;line-height:1.65;margin:0 0 20px}.card{border:1px solid var(--line);border-radius:12px;padding:16px;margin:12px 0;background:#fff}.choice{display:flex;gap:12px;align-items:center;width:100%;padding:16px 14px;margin:10px 0;border:1px solid #dce3e8;border-radius:10px;background:#fff;color:var(--navy);font-size:15px;text-align:left;cursor:pointer}.choice.sel{border:2px solid var(--blue);padding:15px 13px;background:#f7fcff}.radio{width:22px;height:22px;border:1.8px solid #aab9c5;border-radius:50%;flex:none}.choice.sel .radio{border:6px solid var(--blue)}.small{font-size:12px;color:#84929d;line-height:1.55}.btnbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(460px,100%);padding:12px 18px calc(14px + env(safe-area-inset-bottom));background:#ffffffed;border-top:1px solid #eef1f3;display:flex;gap:10px;backdrop-filter:blur(12px)}.btn{flex:1;min-height:52px;border:0;border-radius:9px;background:var(--blue);color:#fff;font-size:17px;font-weight:700}.btn:disabled{background:#d8dfe4;color:#9aa5ad}.btn.secondary{background:#fff;color:var(--blue);border:1px solid #b9d8eb}.tag{font-size:11px;padding:4px 7px;border-radius:5px;background:#edf7fd;color:#187cb8;white-space:nowrap}.row{display:flex;align-items:center;gap:12px}.facility-icon{width:64px;height:64px;border-radius:10px;background:#edf2f5;display:grid;place-items:center;font-size:28px;flex:none}.facility-title{font-size:16px;font-weight:700;line-height:1.4}.facility-meta{font-size:12px;color:#83919b;margin-top:5px}.section-title{font-size:17px;font-weight:700;margin:22px 0 10px}.slot{display:flex;align-items:center;gap:11px;border:1px solid var(--line);border-radius:9px;padding:14px 12px;margin:9px 0;min-height:54px;font-size:14px}.slot .circle{width:20px;height:20px;border:1.7px solid #aab8c2;border-radius:50%;flex:none}.slot.available{cursor:pointer}.slot.selected{border:2px solid var(--blue);background:#f5fbff;padding:13px 11px}.slot.selected .circle{border:6px solid var(--blue)}.slot.unavailable{color:#a8b2ba;background:#fafbfc}.slot .right{margin-left:auto;font-size:12px;color:#8997a1}.notice{background:#f4f8fa;border-radius:9px;padding:12px 13px;color:#738490;font-size:12px;line-height:1.65;margin-top:18px}.reviewrow{display:flex;justify-content:space-between;gap:16px;padding:15px 0;border-bottom:1px solid var(--line);font-size:14px}.reviewrow span{color:#7e8d98;flex:none}.reviewrow strong{text-align:right;overflow-wrap:anywhere}.success{text-align:center;padding:35px 6px}.check{width:76px;height:76px;border-radius:50%;margin:0 auto 20px;background:#e8f8ec;color:#1b9c3b;display:grid;place-items:center;font-size:40px}.pass{border:1px solid #d9e2e7;border-radius:13px;overflow:hidden;margin-top:22px}.passhead{background:#f1f7fa;padding:15px;font-weight:700}.passbody{padding:17px}.passlabel{font-size:12px;color:#7e8c97}.passname{font-size:18px;font-weight:750;margin:5px 0 16px}.passfoot{padding:12px 15px;background:#fff7e8;color:#906a25;font-size:12px;line-height:1.6}.category-icon{font-size:25px;width:36px;text-align:center}.divider{height:1px;background:var(--line);margin:16px 0}
</style></head><body><div class="phone"><header class="top"><button class="nav" id="back" aria-label="戻る">‹</button><div id="topTitle">スタンバイパス</div><button class="nav" id="close" aria-label="最初から">×</button></header><div class="stepbar">練習ステップ <span id="stepNo">1</span> / 6<div class="track"><div id="fill" class="fill" style="width:16.66%"></div></div></div><main id="app" aria-live="polite"></main><div class="btnbar"><button class="btn secondary" id="backBottom">戻る</button><button class="btn" id="next" disabled>次へ</button></div></div>
<script>
const app=document.querySelector('#app'),next=document.querySelector('#next'),back=document.querySelector('#back'),backBottom=document.querySelector('#backBottom');let step=1,category='',tickets=[],facility='',slot='';
const facilities={shop:[['ディズニー＆カンパニー','ショップ','🛍️'],['ギャグファクトリー／ファイブ・アンド・ダイム','ショップ','🎁'],['マクダックス・デパートメントストア','ショップ','🏬'],['エンポーリオ','ショップ','🛍️'],['ファンタジースプリングス・ギフト','ショップ','✨'],['スリーピーホエール・ショップ','ショップ','🐳']],ride:[['ビッグサンダー・マウンテン','アトラクション','🎢'],['プーさんのハニーハント','アトラクション','🍯'],['美女と野獣“魔法のものがたり”','アトラクション','🌹'],['ソアリン：ファンタスティック・フライト','アトラクション','🌎']]};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function top(){document.querySelector('#stepNo').textContent=step;document.querySelector('#fill').style.width=(step/6*100)+'%';document.querySelector('#topTitle').textContent=['スタンバイパス','カテゴリ選択','パークチケット選択','施設選択','時間選択','取得内容確認'][step-1]||'取得完了';back.style.visibility=step===1?'hidden':'visible';backBottom.style.visibility=step===1?'hidden':'visible';}
function render(){top();let html='';if(step===1){html=`<div class="eyebrow">PARK APP / PRACTICE</div><h1 class="heading">スタンバイパス</h1><p class="desc">対象施設の利用時間を選んで取得する流れを練習します。</p><div class="card"><div class="row"><div class="facility-icon">🎟️</div><div><div class="facility-title">スタンバイパス</div><div class="facility-meta">対象施設の利用時間を選択</div></div><span class="tag">練習用</span></div><div class="divider"></div><p class="small">画面下の「スタート」から進んでください。実際のパークチケットや発券状況とは連動しません。</p></div><div class="notice">このサイトは操作練習専用の非公式サンプルです。実際のパスは発行されません。</div>`;setNext(true,'スタート');}
if(step===2){html=`<div class="eyebrow">STEP 1</div><h1 class="heading">カテゴリを選択</h1><p class="desc">練習したい施設のカテゴリを選択してください。</p><button class="choice ${category==='ride'?'sel':''}" data-cat="ride"><span class="category-icon">🎢</span><span><b>アトラクション</b><br><span class="small">対象アトラクションの例</span></span><span class="radio" style="margin-left:auto"></span></button><button class="choice ${category==='shop'?'sel':''}" data-cat="shop"><span class="category-icon">🛍️</span><span><b>ショップ</b><br><span class="small">対象ショップの例</span></span><span class="radio" style="margin-left:auto"></span></button><div class="notice">カテゴリや対象施設は日によって異なります。この画面は練習用の例です。</div>`;setNext(!!category,'次へ');}
if(step===3){html=`<div class="eyebrow">STEP 2</div><h1 class="heading">パークチケット選択</h1><p class="desc">利用するチケットを選択してください。複数選択もできます。</p>${['練習用チケット 1','練習用チケット 2'].map((t,i)=>`<button class="choice ${tickets.includes(t)?'sel':''}" data-ticket="${t}"><span class="radio"></span><span><b>${t}</b><br><span class="small">${i===0?'大人 1名・サンプル':'同行者・サンプル'}</span></span></button>`).join('')}<div class="notice">実際のアプリでは、入園に使用するパークチケットが必要です。ここでは架空のチケットを使用します。</div>`;setNext(tickets.length>0,'施設を選ぶ');}
if(step===4){let list=facilities[category]||[];html=`<div class="eyebrow">STEP 3</div><h1 class="heading">施設を選択</h1><p class="desc">利用したい施設の「時間選択」をタップしてください。</p>${list.map((f,i)=>`<div class="card"><div class="row"><div class="facility-icon">${f[2]}</div><div style="flex:1;min-width:0"><div class="facility-title">${esc(f[0])}</div><div class="facility-meta">${f[1]}・練習用施設</div></div></div><button class="btn" style="width:100%;margin-top:15px;min-height:46px" data-facility="${esc(f[0])}">時間選択</button></div>`).join('')}<div class="notice">表示施設は練習用の例で、当日の対象施設・利用状況とは連動していません。</div>`;setNext(!!facility,'時間を確認');}
if(step===5){const hours=[{title:'12:00',slots:[['12:00〜12:15',false],['12:15〜12:30',false],['12:30〜12:45',false],['12:45〜13:00',false]]},{title:'13:00',slots:[['13:00〜13:15',false],['13:15〜13:30',false],['13:30〜13:45',false],['13:45〜14:00',true]]},{title:'14:00',slots:[['14:00〜14:15',false],['14:15〜14:30',false],['14:30〜14:45',false],['14:45〜15:00',false]]},{title:'15:00',slots:[['15:00〜15:15',false],['15:15〜15:30',false],['15:30〜15:45',false],['15:45〜16:00',false]]}];html=`<div class="eyebrow">STEP 4</div><h1 class="heading">時間選択</h1><p class="desc">施設と希望時間を確認して選択してください。</p><div class="card"><div class="row"><div class="facility-icon">${category==='shop'?'🛍️':'🎢'}</div><div><div class="facility-title">${esc(facility)}</div><div class="facility-meta">${tickets.length}枚の練習用チケットを選択中</div></div></div></div>${hours.map(h=>`<div class="section-title">${h.title}〜</div>${h.slots.map(s=>`<div class="slot ${s[1]?'available':'unavailable'} ${slot===s[0]?'selected':''}" ${s[1]?`data-slot="${s[0]}"`:''}><span class="circle"></span><span>${s[0]}</span><span class="right">${s[1]?'選択できます':'選択不可'}</span></div>`).join('')}`).join('')}<div class="notice">空き時間の表示は操作練習用の固定サンプルです。実際の発券状況ではありません。</div>`;setNext(!!slot,'内容を確認');}
if(step===6){html=`<div class="eyebrow">STEP 5</div><h1 class="heading">取得内容の確認</h1><p class="desc">選択内容を確認して、練習を完了してください。</p><div class="card">${[['カテゴリ',category==='shop'?'ショップ':'アトラクション'],['パークチケット',tickets.join('、')],['施設',facility],['利用時間',slot]].map(r=>`<div class="reviewrow"><span>${r[0]}</span><strong>${esc(r[1])}</strong></div>`).join('')}</div><div class="notice">「練習を完了」を押しても、実際のスタンバイパスは取得されません。</div>`;setNext(true,'練習を完了');}
if(step===7){html=`<div class="success"><div class="check">✓</div><h1 class="heading">練習完了</h1><p class="desc">スタンバイパス取得の操作を最後まで練習しました。</p></div><div class="pass"><div class="passhead">スタンバイパス（練習用）</div><div class="passbody"><div class="passlabel">施設名</div><div class="passname">${esc(facility)}</div><div class="reviewrow"><span>利用時間</span><strong>${esc(slot)}</strong></div><div class="reviewrow"><span>対象チケット</span><strong>${tickets.length}枚（練習用）</strong></div></div><div class="passfoot">これは練習用の表示です。実際の入園・施設利用には使用できません。</div></div>`;setNext(true,'最初から練習する');}
app.innerHTML=html;}
function setNext(ok,label){next.disabled=!ok;next.textContent=label;}
app.addEventListener('click',e=>{const c=e.target.closest('[data-cat]');if(c){category=c.dataset.cat;facility='';slot='';render();return}const t=e.target.closest('[data-ticket]');if(t){let v=t.dataset.ticket;tickets=tickets.includes(v)?tickets.filter(x=>x!==v):[...tickets,v];render();return}const f=e.target.closest('[data-facility]');if(f){facility=f.dataset.facility;slot='';step=5;render();return}const s=e.target.closest('[data-slot]');if(s){slot=s.dataset.slot;render();return}});
next.addEventListener('click',()=>{if(step===1)step=2;else if(step===2)step=3;else if(step===3)step=4;else if(step===4&&facility)step=5;else if(step===5&&slot)step=6;else if(step===6)step=7;else if(step===7){step=1;category='';tickets=[];facility='';slot=''}render()});function goBack(){if(step>1&&step<7)step--;else if(step===7)step=6;render()}back.addEventListener('click',goBack);backBottom.addEventListener('click',goBack);document.querySelector('#close').addEventListener('click',()=>{step=1;category='';tickets=[];facility='';slot='';render()});render();
</script></body></html>
